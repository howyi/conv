services:
  test:
    platform: linux/x86_64
    build: ./docker
    working_dir: /usr/src/app
    environment:
      DB_HOST: mysql-56:3306,mysql-57:3306,mysql-80:3306,maria-100:3306,maria-101:3306,maria-102:3306,maria-103:3306,maria-113:3306
    command: ./docker/wait-for-it.sh -t 0 maria-103:3306 -- vendor/bin/phpunit
    volumes:
      - .:/usr/src/app
    depends_on:
      - maria-113

  ci:
    platform: linux/x86_64
    build: ./docker
    working_dir: /usr/src/app
    environment:
      # xdebug 3 collects no coverage unless the mode asks for it.
      XDEBUG_MODE: coverage
      DB_HOST: mysql-56:3306,mysql-57:3306,mysql-80:3306,maria-100:3306,maria-101:3306,maria-102:3306,maria-103:3306,maria-113:3306
      # Read from the host when set; php-coveralls detects GitHub Actions itself.
      COVERALLS_REPO_TOKEN:
      GITHUB_ACTIONS:
      GITHUB_EVENT_NAME:
      GITHUB_REF:
      GITHUB_RUN_ID:
    command: ./docker/ci.sh
    volumes:
    - .:/usr/src/app
    depends_on:
    - maria-113

  testdb:
    platform: linux/x86_64
    image: mysql:8.0
    command: mysqld --default-authentication-plugin=mysql_native_password
    security_opt:
      - seccomp:unconfined
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_ROOT_PASSWORD: ''
    ports:
      - 33060:3306

  mysql-56:
    platform: linux/x86_64
    image: mysql:5.6
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_ROOT_PASSWORD: ''

  mysql-57:
    platform: linux/x86_64
    image: mysql:5.7
    command: mysqld --general-log=true
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_ROOT_PASSWORD: ''
    depends_on:
     - mysql-56

  mysql-80:
    platform: linux/x86_64
    # Pinned to 8.0.18: the conv-test-suite fixtures record `int(11)`, and MySQL
    # 8.0.19 removed the integer display width from the type it reports. Unpin once
    # those fixtures are gated by server version upstream.
    image: mysql:8.0.18
    command: mysqld --default-authentication-plugin=mysql_native_password
    security_opt:
    - seccomp:unconfined
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_ROOT_PASSWORD: ''
    depends_on:
     - mysql-57

  maria-100:
    platform: linux/x86_64
    image: mariadb:10.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_ROOT_PASSWORD: ''
    depends_on:
        - mysql-80

  maria-101:
    platform: linux/x86_64
    image: mariadb:10.1
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_ROOT_PASSWORD: ''
    depends_on:
        - maria-100

  maria-102:
    platform: linux/x86_64
    image: mariadb:10.2
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_ROOT_PASSWORD: ''
    depends_on:
        - maria-101

  maria-103:
    platform: linux/x86_64
    image: mariadb:10.3
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_ROOT_PASSWORD: ''
    depends_on:
        - maria-102

  maria-113:
    platform: linux/x86_64
    image: mariadb:11.3
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_ROOT_PASSWORD: ''
    depends_on:
        - maria-103
